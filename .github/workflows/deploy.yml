name: Deploy FuzzForge

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Add permissions needed for GitHub Pages
    permissions:
      contents: write      # Allows writing to the repository
      pages: write         # Allows configuring GitHub Pages
      id-token: write      # Needed for authentication with GitHub
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        env:
          VITE_API_PROXY_URL: https://fuzzforge.onrender.com/api/analyze
          
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          token: ${{ secrets.GITHUB_TOKEN }}  # Uses the built-in token
          branch: gh-pages                    # The branch to deploy to
          clean: true                         # Automatically remove deleted files